<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord Web</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#313338;color:#dbdee1;overflow:hidden}button,input{font:inherit}button{border:0;cursor:pointer}
.hidden{display:none!important}.auth{height:100vh;display:grid;place-items:center;background:#1e1f22}.auth-card{width:min(430px,92vw);background:#313338;border-radius:8px;padding:32px;box-shadow:0 12px 45px #0008}.auth-card h1{margin:0 0 8px;text-align:center}.auth-card p{text-align:center;color:#949ba4}.field{margin:16px 0}.field label{display:block;font-size:12px;font-weight:700;color:#b5bac1;margin-bottom:7px}.field input{width:100%;padding:12px;border:0;border-radius:5px;background:#1e1f22;color:#fff;outline:0}.primary{background:#5865f2;color:#fff;border-radius:5px;padding:11px 14px;font-weight:700}.wide{width:100%}.auth-switch{text-align:center;margin-top:18px;color:#949ba4}.linkbtn{background:none;color:#00a8fc;padding:0}.error{background:#5c1f23;color:#ffb3b3;border-radius:5px;padding:10px;font-size:13px;margin:12px 0}.app{height:100vh;display:flex}.servers{width:72px;background:#1e1f22;padding:12px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}.server{width:50px;height:50px;border-radius:16px;background:#313338;color:#ddd;font-weight:700;font-size:18px}.server:hover,.server.active{border-radius:15px;background:#5865f2;color:#fff}.add{font-size:28px;color:#23a559}.divider{width:32px;height:2px;background:#313338}.sidebar{width:240px;background:#2b2d31;display:flex;flex-direction:column}.serverhead{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;border-bottom:1px solid #202225}.channels{padding:14px 8px;overflow:auto;flex:1}.category{font-size:12px;color:#949ba4;font-weight:700;padding:8px;display:flex;justify-content:space-between}.category button{background:none;color:#aaa}.channel{height:36px;padding:0 10px;border-radius:5px;display:flex;align-items:center;gap:9px;color:#949ba4;margin:2px 0}.channel:hover,.channel.active{background:#404249;color:#fff}.channel .x{margin-left:auto;display:none;color:#aaa}.channel:hover .x{display:block}.userbar{height:54px;background:#232428;padding:7px;display:flex;align-items:center;gap:8px}.avatar{width:34px;height:34px;border-radius:50%;background:#5865f2;display:grid;place-items:center;font-weight:700;color:#fff}.username{font-size:13px;font-weight:700;flex:1}.tag{font-size:11px;color:#949ba4}.iconbtn{background:transparent;color:#b5bac1;font-size:17px;padding:7px;border-radius:5px}.iconbtn:hover{background:#3b3d44;color:#fff}.chat{min-width:0;flex:1;display:flex;flex-direction:column;background:#313338}.chathead{height:58px;border-bottom:1px solid #26272b;display:flex;align-items:center;padding:0 18px;gap:10px;font-weight:700}.hash{font-size:25px;color:#949ba4}.topic{font-weight:400;color:#949ba4;font-size:13px;border-left:1px solid #4b4d52;padding-left:12px}.messages{flex:1;overflow:auto;padding:18px 20px}.welcome{margin:35px 0 25px}.welcome h1{font-size:30px;margin:0 0 8px}.welcome p{color:#949ba4}.message{display:flex;gap:12px;padding:7px 8px;margin:1px 0;border-radius:5px}.message:hover{background:#2e3035}.message .avatar{flex:none;width:40px;height:40px}.meta{display:flex;align-items:baseline;gap:8px}.name{font-weight:700;color:#fff}.time{font-size:11px;color:#949ba4}.text{margin-top:3px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.composer{padding:0 20px 20px}.inputbox{background:#383a40;border-radius:8px;display:flex;align-items:center;padding:0 10px}.inputbox input{flex:1;background:transparent;border:0;outline:0;color:#ddd;padding:13px 8px}.send{background:#5865f2;color:#fff;border-radius:6px;padding:8px 13px;font-weight:700}.members{width:210px;background:#2b2d31;padding:18px 12px;overflow:auto}.members h3{font-size:12px;color:#949ba4;margin:5px 8px 12px;text-transform:uppercase}.member{display:flex;align-items:center;gap:10px;padding:7px;border-radius:5px}.member:hover{background:#404249}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:5}.modal.open{display:grid}.card{width:min(460px,92vw);background:#313338;border-radius:10px;padding:22px;box-shadow:0 10px 40px #0008}.card h2{margin-top:0}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.secondary{background:#4e5058;color:#fff;padding:9px 14px;border-radius:5px}.danger{background:#da373c;color:#fff;padding:9px 14px;border-radius:5px}.notice{font-size:13px;color:#949ba4;line-height:1.5}@media(max-width:850px){.members{display:none}}@media(max-width:600px){.servers{width:58px;padding:10px 6px}.server{width:44px;height:44px}.sidebar{width:205px}.topic{display:none}}@media(max-width:430px){.sidebar{display:none}.servers{width:58px}.chathead{padding-left:12px}.messages{padding:12px}.composer{padding:0 10px 10px}}
</style>
</head>
<body>
<div class="auth" id="authScreen"><div class="auth-card"><h1 id="authTitle">Welcome back!</h1><p id="authSubtitle">Log in to your Discord Web account.</p><div id="authError" class="error hidden"></div><div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>USERNAME</label><input id="username" maxlength="24" autocomplete="username" placeholder="Only needed when signing up"></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"></div><button class="primary wide" id="authButton">Log In</button><div class="auth-switch"><span id="switchText">Need an account?</span> <button class="linkbtn" id="switchMode">Register</button></div></div></div>
<div class="app hidden" id="app"><aside class="servers" id="servers"></aside><aside class="sidebar"><div class="serverhead"><span id="serverName">Loading...</span><button class="iconbtn" id="serverMenu">⌄</button></div><div class="channels" id="channels"></div><div class="userbar"><div class="avatar" id="myAvatar">U</div><div class="username"><div id="myName">User</div><div class="tag">online</div></div><button class="iconbtn" id="settings">⚙</button></div></aside><main class="chat"><div class="chathead"><span class="hash">#</span><span id="channelName">general</span><span class="topic">Real-time Discord-style chat</span></div><div class="messages" id="messages"></div><div class="composer"><div class="inputbox"><input id="messageInput" autocomplete="off" placeholder="Message #general"><button class="send" id="send">Send</button></div></div></main><aside class="members"><h3>Online — <span id="memberCount">1</span></h3><div id="members"></div></aside></div>
<div class="modal" id="modal"><div class="card"><h2 id="modalTitle">Settings</h2><div id="modalBody"></div><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Save</button></div></div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './supabase-config.js';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let user=null,profile=null,servers=[],currentServer=null,channels=[],currentChannel=null,realtimeChannel=null,authMode='login';
const $=id=>document.getElementById(id);const init=n=>(n||'?').trim()[0]?.toUpperCase()||'?';
function showError(msg){$('authError').textContent=msg;$('authError').classList.remove('hidden')}
function clearError(){$('authError').classList.add('hidden')}
function setAuthMode(signup){authMode=signup?'signup':'login';$('authTitle').textContent=signup?'Create your account':'Welcome back!';$('authSubtitle').textContent=signup?'Create a real online Discord Web account.':'Log in to your Discord Web account.';$('username').classList.toggle('hidden',!signup);$('authButton').textContent=signup?'Register':'Log In';$('switchText').textContent=signup?'Already have an account?':'Need an account?';$('switchMode').textContent=signup?'Log In':'Register'}
$('switchMode').onclick=()=>{clearError();setAuthMode(authMode!=='signup')};
$('authButton').onclick=authSubmit;
$('password').onkeydown=e=>{if(e.key==='Enter')authSubmit()};$('email').onkeydown=e=>{if(e.key==='Enter')authSubmit()};
async function authSubmit(){clearError();let email=$('email').value.trim(),password=$('password').value,username=$('username').value.trim();if(!email||!password)return showError('Enter your email and password.');if(authMode==='signup'&&!username)return showError('Choose a username.');$('authButton').disabled=true;$('authButton').textContent=authMode==='signup'?'Creating...':'Logging in...';try{let result;if(authMode==='signup'){result=await supabase.auth.signUp({email,password,options:{data:{username}}});if(result.error)throw result.error;if(!result.data.session){showError('Account created. Check your email to confirm your account, then log in.');return}}else{result=await supabase.auth.signInWithPassword({email,password});if(result.error)throw result.error}if(result.data.session)await boot(result.data.session.user)}catch(e){showError(e.message||'Authentication failed.')}finally{$('authButton').disabled=false;$('authButton').textContent=authMode==='signup'?'Register':'Log In'}}
async function boot(u){user=u;let p=await supabase.from('profiles').select('*').eq('id',u.id).maybeSingle();if(p.error)throw p.error;profile=p.data;if(!profile){let ins=await supabase.from('profiles').insert({id:u.id,username:u.user_metadata?.username||u.email?.split('@')[0]||'User'}).select().single();if(ins.error)throw ins.error;profile=ins.data}$('authScreen').classList.add('hidden');$('app').classList.remove('hidden');$('myName').textContent=profile.username;$('myAvatar').textContent=init(profile.username);await loadServers();}
async function loadServers(){let m=await supabase.from('server_members').select('server_id').eq('user_id',user.id);if(m.error)throw m.error;let ids=m.data.map(x=>x.server_id);let q=ids.length?await supabase.from('servers').select('*').in('id',ids).order('created_at'): {data:[],error:null};if(q.error)throw q.error;servers=q.data||[];if(!servers.length){await createServer('My Discord');return}currentServer=currentServer&&servers.find(s=>s.id===currentServer.id)||servers[0];await loadChannels();renderServers();}
async function createServer(name){let ins=await supabase.from('servers').insert({name,icon:init(name),owner_id:user.id}).select().single();if(ins.error)throw ins.error;let mem=await supabase.from('server_members').insert({server_id:ins.data.id,user_id:user.id,role:'owner'});if(mem.error)throw mem.error;let ch=await supabase.from('channels').insert({server_id:ins.data.id,name:'general'}).select().single();if(ch.error)throw ch.error;currentServer=ins.data;await loadServers()}
async function loadChannels(){let q=await supabase.from('channels').select('*').eq('server_id',currentServer.id).order('created_at');if(q.error)throw q.error;channels=q.data||[];if(!channels.length){let c=await supabase.from('channels').insert({server_id:currentServer.id,name:'general'}).select().single();if(c.error)throw c.error;channels=[c.data]}currentChannel=currentChannel&&channels.find(c=>c.id===currentChannel.id)||channels[0];renderChannels();await loadMessages();subscribeRealtime()}
function renderServers(){let e=$('servers');e.innerHTML='';servers.forEach(s=>{let b=document.createElement('button');b.className='server '+(s.id===currentServer.id?'active':'');b.textContent=s.icon||init(s.name);b.title=s.name;b.onclick=async()=>{currentServer=s;currentChannel=null;await loadChannels();renderServers()};e.appendChild(b)});let d=document.createElement('div');d.className='divider';e.appendChild(d);let a=document.createElement('button');a.className='server add';a.textContent='+';a.title='Create server';a.onclick=openServer;e.appendChild(a)}
function renderChannels(){if(!currentServer)return;$('serverName').textContent=currentServer.name;let e=$('channels');e.innerHTML='<div class="category">TEXT CHANNELS <button id="addChannel">+</button></div>';channels.forEach(c=>{let b=document.createElement('div');b.className='channel '+(c.id===currentChannel?.id?'active':'');b.innerHTML='<span>#</span><span></span><span class="x">×</span>';b.children[1].textContent=c.name;b.onclick=async ev=>{if(ev.target.className==='x'){await deleteChannel(c);return}currentChannel=c;renderChannels();await loadMessages();subscribeRealtime()};e.appendChild(b)});$('addChannel').onclick=openChannel;$('channelName').textContent=currentChannel?.name||'general';$('messageInput').placeholder='Message #'+(currentChannel?.name||'general')}
async function loadMessages(){if(!currentChannel)return;let q=await supabase.from('messages').select('id,content,created_at,user_id').eq('channel_id',currentChannel.id).order('created_at');if(q.error)return showChatError(q.error.message);let ids=[...new Set((q.data||[]).map(m=>m.user_id))];let names={};if(ids.length){let p=await supabase.from('profiles').select('id,username').in('id',ids);if(!p.error)(p.data||[]).forEach(x=>names[x.id]=x.username)}renderMessages(q.data||[],names)}
function renderMessages(list,names={}){let e=$('messages');e.innerHTML='<div class="welcome"><h1>Welcome to #'+(currentChannel?.name||'general')+'!</h1><p>This is the beginning of this channel.</p></div>';list.forEach(m=>addMessageElement(e,m,names[m.user_id]||'User'));e.scrollTop=e.scrollHeight}
function addMessageElement(e,m,name){let r=document.createElement('div');r.className='message';r.innerHTML='<div class="avatar">'+init(name)+'</div><div><div class="meta"><span class="name"></span><span class="time"></span></div><div class="text"></div></div>';r.querySelector('.name').textContent=name;r.querySelector('.time').textContent=new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});r.querySelector('.text').textContent=m.content;e.appendChild(r)}
function showChatError(msg){$('messages').innerHTML='<div class="welcome"><h1>Chat error</h1><p>'+msg+'</p></div>'}
function subscribeRealtime(){if(realtimeChannel)supabase.removeChannel(realtimeChannel);if(!currentChannel)return;realtimeChannel=supabase.channel('messages-'+currentChannel.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'channel_id=eq.'+currentChannel.id},async payload=>{let m=payload.new;let p=await supabase.from('profiles').select('username').eq('id',m.user_id).maybeSingle();let exists=document.querySelector('[data-message-id="'+m.id+'"]');if(!exists){let e=$('messages');addMessageElement(e,m,p.data?.username||'User');e.scrollTop=e.scrollHeight}}).subscribe()}
async function send(){let i=$('messageInput'),t=i.value.trim();if(!t||!currentChannel||!user)return;i.value='';let q=await supabase.from('messages').insert({channel_id:currentChannel.id,user_id:user.id,content:t});if(q.error){i.value=t;showChatError(q.error.message)}}$('send').onclick=send;$('messageInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};
function openModal(title,body,action,button='Save'){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open');$('confirm').textContent=button;$('confirm').onclick=action;$('cancel').onclick=()=>$('modal').classList.remove('open');setTimeout(()=>document.querySelector('#modal input')?.focus(),50)}
function openServer(){openModal('Create a server','<div class="field"><label>SERVER NAME</label><input id="modalInput" maxlength="32" placeholder="My new server"></div><p class="notice">This server is stored online in Supabase and can be accessed from another device.</p>',async()=>{let n=$('modalInput').value.trim();if(!n)return;try{await createServer(n);$('modal').classList.remove('open');renderServers()}catch(e){alert(e.message)}})}
function openChannel(){openModal('Create a channel','<div class="field"><label>CHANNEL NAME</label><input id="modalInput" maxlength="32" placeholder="new-channel"></div>',async()=>{let n=$('modalInput').value.trim().toLowerCase().replace(/[^a-z0-9-_]/g,'-');if(!n)return;let q=await supabase.from('channels').insert({server_id:currentServer.id,name:n}).select().single();if(q.error)return alert(q.error.message);currentChannel=q.data;channels.push(q.data);$('modal').classList.remove('open');renderChannels();await loadMessages();subscribeRealtime()})}
async function deleteChannel(c){if(channels.length===1)return;if(!confirm('Delete #'+c.name+'?'))return;let q=await supabase.from('channels').delete().eq('id',c.id);if(q.error)return alert(q.error.message);channels=channels.filter(x=>x.id!==c.id);currentChannel=channels[0];renderChannels();await loadMessages();subscribeRealtime()}
$('serverMenu').onclick=openServer;
$('settings').onclick=()=>openModal('Account Settings','<div class="field"><label>DISPLAY NAME</label><input id="modalInput" maxlength="24" value="'+(profile?.username||'').replace(/"/g,'&quot;')+'"></div><p class="notice">Your display name is saved to your Supabase profile.</p>',async()=>{let n=$('modalInput').value.trim();if(!n)return;let q=await supabase.from('profiles').update({username:n}).eq('id',user.id);if(q.error)return alert(q.error.message);profile.username=n;$('myName').textContent=n;$('myAvatar').textContent=init(n);$('modal').classList.remove('open')});
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
const {data:{session}}=await supabase.auth.getSession();if(session){try{await boot(session.user)}catch(e){console.error(e);showError(e.message)}}
supabase.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){location.reload()}});
</script>
</body>
</html>
