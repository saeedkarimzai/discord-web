<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord Web</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#313338;color:#dbdee1;overflow:hidden}button,input{font:inherit}button{border:0;cursor:pointer}.app{height:100vh;display:flex}.servers{width:72px;background:#1e1f22;padding:12px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}.server{width:50px;height:50px;border-radius:16px;background:#313338;color:#dbdee1;font-weight:700;font-size:18px;transition:.15s}.server:hover,.server.active{border-radius:15px;background:#5865f2;color:white}.add{font-size:28px;color:#23a559}.divider{width:32px;height:2px;background:#313338}.sidebar{width:240px;background:#2b2d31;display:flex;flex-direction:column}.serverhead{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;border-bottom:1px solid #202225}.channels{padding:14px 8px;overflow:auto;flex:1}.category{font-size:12px;color:#949ba4;font-weight:700;padding:8px 8px 5px;display:flex;justify-content:space-between}.channel{height:36px;padding:0 10px;border-radius:5px;display:flex;align-items:center;gap:9px;color:#949ba4;margin:2px 0}.channel:hover,.channel.active{background:#404249;color:#fff}.channel span:first-child{font-size:20px}.userbar{height:54px;background:#232428;padding:7px;display:flex;align-items:center;gap:8px}.avatar{width:34px;height:34px;border-radius:50%;background:#5865f2;display:grid;place-items:center;font-weight:700;color:#fff}.username{font-size:13px;font-weight:700;flex:1}.tag{font-size:11px;color:#949ba4}.iconbtn{background:transparent;color:#b5bac1;font-size:17px;padding:7px;border-radius:5px}.iconbtn:hover{background:#3b3d44;color:#fff}.chat{min-width:0;flex:1;display:flex;flex-direction:column;background:#313338}.chathead{height:58px;border-bottom:1px solid #26272b;display:flex;align-items:center;padding:0 18px;gap:10px;font-weight:700}.chathead .hash{font-size:25px;color:#949ba4}.topic{font-weight:400;color:#949ba4;font-size:13px;border-left:1px solid #4b4d52;padding-left:12px}.messages{flex:1;overflow:auto;padding:18px 20px}.welcome{margin:35px 0 25px}.welcome h1{font-size:30px;margin:0 0 8px}.welcome p{color:#949ba4}.message{display:flex;gap:12px;padding:7px 8px;margin:1px 0;border-radius:5px}.message:hover{background:#2e3035}.message .avatar{flex:none;width:40px;height:40px}.meta{display:flex;align-items:baseline;gap:8px}.name{font-weight:700;color:#fff}.time{font-size:11px;color:#949ba4}.text{margin-top:3px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.composer{padding:0 20px 20px}.inputbox{background:#383a40;border-radius:8px;display:flex;align-items:center;padding:0 10px}.inputbox input{flex:1;background:transparent;border:0;outline:0;color:#dbdee1;padding:13px 8px}.send{background:#5865f2;color:#fff;border-radius:6px;padding:7px 12px;font-weight:700}.members{width:210px;background:#2b2d31;padding:18px 12px;overflow:auto}.members h3{font-size:12px;color:#949ba4;margin:5px 8px 12px;text-transform:uppercase}.member{display:flex;align-items:center;gap:10px;padding:7px;border-radius:5px}.member:hover{background:#404249}.status{width:10px;height:10px;background:#23a559;border:2px solid #2b2d31;border-radius:50%;position:absolute;transform:translate(25px,11px)}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center}.modal.open{display:grid}.card{width:min(440px,90vw);background:#313338;border-radius:10px;padding:22px;box-shadow:0 10px 40px #0008}.card h2{margin-top:0}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:700;color:#b5bac1;margin-bottom:7px}.field input{width:100%;padding:10px;border:0;border-radius:5px;background:#1e1f22;color:#fff;outline:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.secondary{background:#4e5058;color:#fff;padding:9px 14px;border-radius:5px}.primary{background:#5865f2;color:#fff;padding:9px 14px;border-radius:5px}@media(max-width:850px){.members{display:none}}@media(max-width:600px){.servers{width:58px;padding:10px 6px}.server{width:44px;height:44px}.sidebar{width:205px}.topic{display:none}}@media(max-width:430px){.sidebar{display:none}.chathead{padding-left:12px}.messages{padding:12px}.composer{padding:0 10px 10px}}
</style>
</head>
<body>
<div class="app">
  <aside class="servers" id="servers"></aside>
  <aside class="sidebar">
    <div class="serverhead"><span id="serverName">My Discord</span><button class="iconbtn" id="serverMenu">⌄</button></div>
    <div class="channels" id="channels"></div>
    <div class="userbar"><div class="avatar" id="myAvatar">B</div><div class="username"><div id="myName">Bob</div><div class="tag">online</div></div><button class="iconbtn" id="settings">⚙</button></div>
  </aside>
  <main class="chat">
    <div class="chathead"><span class="hash">#</span><span id="channelName">general</span><span class="topic">Welcome to your new server.</span></div>
    <div class="messages" id="messages"></div>
    <div class="composer"><div class="inputbox"><input id="messageInput" autocomplete="off" placeholder="Message #general"><button class="send" id="send">Send</button></div></div>
  </main>
  <aside class="members"><h3>Online — <span id="memberCount">3</span></h3><div id="members"></div></aside>
</div>
<div class="modal" id="modal"><div class="card"><h2>User Settings</h2><div class="field"><label>DISPLAY NAME</label><input id="nameInput" maxlength="24"></div><div class="field"><label>STATUS</label><input value="online" disabled></div><div class="modal-actions"><button class="secondary" id="closeModal">Cancel</button><button class="primary" id="saveSettings">Save</button></div></div></div>
<script>
const defaultServers=[{name:'My Discord',icon:'D',channels:['general','random','memes','gaming']},{name:'Gaming',icon:'G',channels:['lobby','roblox','minecraft']},{name:'Friends',icon:'F',channels:['chat','photos']}];
const defaultMessages={general:[['Alex','Welcome to the server!'],['Mia','This is our first message.'],['Bob','Let’s build something real.']],random:[['Mia','Random chat goes here.']],memes:[['Alex','Post your best memes.']],gaming:[['Bob','Anyone playing later?']]};
let state=JSON.parse(localStorage.getItem('discordWebState')||'null')||{server:0,channel:'general',name:'Bob',messages:structuredClone(defaultMessages)};
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('discordWebState',JSON.stringify(state))}
function initials(n){return n.trim().slice(0,1).toUpperCase()||'B'}
function renderServers(){const el=$('servers');el.innerHTML='';defaultServers.forEach((s,i)=>{const b=document.createElement('button');b.className='server '+(i===state.server?'active':'');b.textContent=s.icon;b.title=s.name;b.onclick=()=>{state.server=i;state.channel=defaultServers[i].channels[0];renderAll();save()};el.appendChild(b)});const d=document.createElement('div');d.className='divider';el.appendChild(d);const a=document.createElement('button');a.className='server add';a.textContent='+';a.title='Add server';a.onclick=()=>alert('Server creation is coming next. This version is focused on the working Discord-style core.');el.appendChild(a)}
function renderChannels(){const s=defaultServers[state.server];$('serverName').textContent=s.name;const el=$('channels');el.innerHTML='<div class="category">TEXT CHANNELS <span>+</span></div>';s.channels.forEach(c=>{const b=document.createElement('div');b.className='channel '+(c===state.channel?'active':'');b.innerHTML='<span>#</span><span>'+c+'</span>';b.onclick=()=>{state.channel=c;renderAll();save()};el.appendChild(b)});$('channelName').textContent=state.channel;$('messageInput').placeholder='Message #'+state.channel}
function renderMessages(){const el=$('messages');el.innerHTML='';const list=state.messages[state.channel]||[];if(!list.length){el.innerHTML='<div class="welcome"><h1>Welcome to #'+state.channel+'!</h1><p>This is the beginning of this channel.</p></div>'}else{const w=document.createElement('div');w.className='welcome';w.innerHTML='<h1>Welcome to #'+state.channel+'</h1><p>This is the beginning of this channel.</p></div>';el.appendChild(w)}list.forEach((m,i)=>{const row=document.createElement('div');row.className='message';row.innerHTML='<div class="avatar">'+initials(m[0])+'</div><div><div class="meta"><span class="name"></span><span class="time">Today</span></div><div class="text"></div></div>';row.querySelector('.name').textContent=m[0];row.querySelector('.text').textContent=m[1];el.appendChild(row)});el.scrollTop=el.scrollHeight}
function renderMembers(){const people=['Bob','Alex','Mia'];$('memberCount').textContent=people.length;const el=$('members');el.innerHTML='';people.forEach(n=>{const d=document.createElement('div');d.className='member';d.innerHTML='<div class="avatar">'+initials(n)+'</div><div>'+n+'</div>';el.appendChild(d)})}
function renderAll(){renderServers();renderChannels();renderMessages();renderMembers();$('myName').textContent=state.name;$('myAvatar').textContent=initials(state.name)}
function send(){const input=$('messageInput');const text=input.value.trim();if(!text)return;if(!state.messages[state.channel])state.messages[state.channel]=[];state.messages[state.channel].push([state.name,text]);input.value='';renderMessages();save()}
$('send').onclick=send;$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('settings').onclick=()=>{$('nameInput').value=state.name;$('modal').classList.add('open');$('nameInput').focus()};$('closeModal').onclick=()=>{$('modal').classList.remove('open')};$('saveSettings').onclick=()=>{const n=$('nameInput').value.trim();if(n)state.name=n;save();renderAll();$('modal').classList.remove('open')};$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open')});
renderAll();
</script>
</body>
</html>
