<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discord Web</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#313338;color:#dbdee1;overflow:hidden}button,input{font:inherit}button{border:0;cursor:pointer}.app{height:100vh;display:flex}.servers{width:72px;background:#1e1f22;padding:12px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}.server{width:50px;height:50px;border-radius:16px;background:#313338;color:#ddd;font-weight:700;font-size:18px}.server:hover,.server.active{border-radius:15px;background:#5865f2;color:#fff}.add{font-size:28px;color:#23a559}.divider{width:32px;height:2px;background:#313338}.sidebar{width:240px;background:#2b2d31;display:flex;flex-direction:column}.serverhead{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;border-bottom:1px solid #202225}.channels{padding:14px 8px;overflow:auto;flex:1}.category{font-size:12px;color:#949ba4;font-weight:700;padding:8px;display:flex;justify-content:space-between}.category button{background:none;color:#aaa}.channel{height:36px;padding:0 10px;border-radius:5px;display:flex;align-items:center;gap:9px;color:#949ba4;margin:2px 0}.channel:hover,.channel.active{background:#404249;color:#fff}.channel .x{margin-left:auto;display:none;color:#aaa}.channel:hover .x{display:block}.userbar{height:54px;background:#232428;padding:7px;display:flex;align-items:center;gap:8px}.avatar{width:34px;height:34px;border-radius:50%;background:#5865f2;display:grid;place-items:center;font-weight:700;color:#fff}.username{font-size:13px;font-weight:700;flex:1}.tag{font-size:11px;color:#949ba4}.iconbtn{background:transparent;color:#b5bac1;font-size:17px;padding:7px;border-radius:5px}.iconbtn:hover{background:#3b3d44;color:#fff}.chat{min-width:0;flex:1;display:flex;flex-direction:column;background:#313338}.chathead{height:58px;border-bottom:1px solid #26272b;display:flex;align-items:center;padding:0 18px;gap:10px;font-weight:700}.hash{font-size:25px;color:#949ba4}.topic{font-weight:400;color:#949ba4;font-size:13px;border-left:1px solid #4b4d52;padding-left:12px}.messages{flex:1;overflow:auto;padding:18px 20px}.welcome{margin:35px 0 25px}.welcome h1{font-size:30px;margin:0 0 8px}.welcome p{color:#949ba4}.message{display:flex;gap:12px;padding:7px 8px;margin:1px 0;border-radius:5px}.message:hover{background:#2e3035}.message .avatar{flex:none;width:40px;height:40px}.meta{display:flex;align-items:baseline;gap:8px}.name{font-weight:700;color:#fff}.time{font-size:11px;color:#949ba4}.text{margin-top:3px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.composer{padding:0 20px 20px}.inputbox{background:#383a40;border-radius:8px;display:flex;align-items:center;padding:0 10px}.inputbox input{flex:1;background:transparent;border:0;outline:0;color:#ddd;padding:13px 8px}.send,.primary{background:#5865f2;color:#fff;border-radius:6px;padding:8px 13px;font-weight:700}.members{width:210px;background:#2b2d31;padding:18px 12px;overflow:auto}.members h3{font-size:12px;color:#949ba4;margin:5px 8px 12px;text-transform:uppercase}.member{display:flex;align-items:center;gap:10px;padding:7px;border-radius:5px}.member:hover{background:#404249}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:5}.modal.open{display:grid}.card{width:min(460px,92vw);background:#313338;border-radius:10px;padding:22px;box-shadow:0 10px 40px #0008}.card h2{margin-top:0}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:700;color:#b5bac1;margin-bottom:7px}.field input{width:100%;padding:11px;border:0;border-radius:5px;background:#1e1f22;color:#fff;outline:0}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.secondary{background:#4e5058;color:#fff;padding:9px 14px;border-radius:5px}.danger{background:#da373c;color:#fff;padding:9px 14px;border-radius:5px}.notice{font-size:13px;color:#949ba4;line-height:1.5}@media(max-width:850px){.members{display:none}}@media(max-width:600px){.servers{width:58px;padding:10px 6px}.server{width:44px;height:44px}.sidebar{width:205px}.topic{display:none}}@media(max-width:430px){.sidebar{display:none}.servers{width:58px}.chathead{padding-left:12px}.messages{padding:12px}.composer{padding:0 10px 10px}}</style></head><body><div class="app"><aside class="servers" id="servers"></aside><aside class="sidebar"><div class="serverhead"><span id="serverName"></span><button class="iconbtn" id="serverMenu">⌄</button></div><div class="channels" id="channels"></div><div class="userbar"><div class="avatar" id="myAvatar">B</div><div class="username"><div id="myName">Bob</div><div class="tag">online</div></div><button class="iconbtn" id="settings">⚙</button></div></aside><main class="chat"><div class="chathead"><span class="hash">#</span><span id="channelName">general</span><span class="topic">A browser-first Discord-style chat</span></div><div class="messages" id="messages"></div><div class="composer"><div class="inputbox"><input id="messageInput" autocomplete="off" placeholder="Message #general"><button class="send" id="send">Send</button></div></div></main><aside class="members"><h3>Online — <span id="memberCount">1</span></h3><div id="members"></div></aside></div><div class="modal" id="modal"><div class="card"><h2 id="modalTitle">Settings</h2><div id="modalBody"></div><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirm">Save</button></div></div></div><script>
const starter={servers:[{name:'My Discord',icon:'D',channels:['general','random','memes','gaming']},{name:'Gaming',icon:'G',channels:['lobby','roblox','minecraft']},{name:'Friends',icon:'F',channels:['chat','photos']}],messages:{general:[['Alex','Welcome to the server!'],['Mia','This is our first message.'],['Bob','Let’s build something real.']],random:[['Mia','Random chat goes here.']],memes:[['Alex','Post your best memes.']],gaming:[['Bob','Anyone playing later?']],lobby:[],roblox:[],minecraft:[],chat:[],photos:[]}};
let state=JSON.parse(localStorage.getItem('discordWebState')||'null')||{servers:starter.servers,messages:starter.messages,server:0,channel:'general',name:'Bob'};
function save(){localStorage.setItem('discordWebState',JSON.stringify(state))}function $(x){return document.getElementById(x)}function init(n){return(n||'?').trim()[0].toUpperCase()}function current(){return state.servers[state.server]}
function renderServers(){let e=$('servers');e.innerHTML='';state.servers.forEach((s,i)=>{let b=document.createElement('button');b.className='server '+(i===state.server?'active':'');b.textContent=s.icon||init(s.name);b.title=s.name;b.onclick=()=>{state.server=i;state.channel=s.channels[0];render();save()};e.appendChild(b)});let d=document.createElement('div');d.className='divider';e.appendChild(d);let a=document.createElement('button');a.className='server add';a.textContent='+';a.title='Create server';a.onclick=()=>openServer();e.appendChild(a)}
function renderChannels(){let s=current();$('serverName').textContent=s.name;let e=$('channels');e.innerHTML='<div class="category">TEXT CHANNELS <button id="addChannel">+</button></div>';s.channels.forEach(c=>{let b=document.createElement('div');b.className='channel '+(c===state.channel?'active':'');b.innerHTML='<span>#</span><span></span><span class="x">×</span>';b.children[1].textContent=c;b.onclick=ev=>{if(ev.target.className==='x'){deleteChannel(c);return}state.channel=c;render();save()};e.appendChild(b)});$('addChannel').onclick=openChannel;$('channelName').textContent=state.channel;$('messageInput').placeholder='Message #'+state.channel}
function renderMessages(){let e=$('messages'),list=state.messages[state.channel]||[];e.innerHTML='<div class="welcome"><h1>Welcome to #'+state.channel+'!</h1><p>This is the beginning of this channel.</p></div>';list.forEach(m=>{let r=document.createElement('div');r.className='message';r.innerHTML='<div class="avatar">'+init(m[0])+'</div><div><div class="meta"><span class="name"></span><span class="time">Today</span></div><div class="text"></div></div>';r.querySelector('.name').textContent=m[0];r.querySelector('.text').textContent=m[1];e.appendChild(r)});e.scrollTop=e.scrollHeight}
function renderMembers(){let people=[state.name,'Alex','Mia'];$('memberCount').textContent=people.length;let e=$('members');e.innerHTML='';people.forEach(n=>{let d=document.createElement('div');d.className='member';d.innerHTML='<div class="avatar">'+init(n)+'</div><div></div>';d.children[1].textContent=n;e.appendChild(d)})}
function render(){renderServers();renderChannels();renderMessages();renderMembers();$('myName').textContent=state.name;$('myAvatar').textContent=init(state.name)}
function send(){let i=$('messageInput'),t=i.value.trim();if(!t)return;(state.messages[state.channel]??=[]).push([state.name,t]);i.value='';renderMessages();save()}$('send').onclick=send;$('messageInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};
function show(title,body,action){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open');$('confirm').onclick=action;$('cancel').onclick=()=>$('modal').classList.remove('open');setTimeout(()=>document.querySelector('#modal input')?.focus(),50)}
function openServer(){show('Create a server','<div class="field"><label>SERVER NAME</label><input id="modalInput" maxlength="32" placeholder="My new server"></div><p class="notice">This creates a local server saved in this browser. Real online accounts and syncing need a backend later.</p>',()=>{let n=$('modalInput').value.trim();if(!n)return;state.servers.push({name:n,icon:init(n),channels:['general']});state.server=state.servers.length-1;state.channel='general';state.messages.general=state.messages.general||[];state.messages['general_'+state.server]=[];state.messages[state.channel]=state.messages[state.channel]||[];save();$('modal').classList.remove('open');render()})}
function openChannel(){show('Create a channel','<div class="field"><label>CHANNEL NAME</label><input id="modalInput" maxlength="32" placeholder="new-channel"></div>',()=>{let n=$('modalInput').value.trim().toLowerCase().replace(/[^a-z0-9-_]/g,'-');if(!n)return;if(current().channels.includes(n))return;current().channels.push(n);state.messages[n]=[];state.channel=n;save();$('modal').classList.remove('open');render()})}
function deleteChannel(c){if(current().channels.length===1)return;if(!confirm('Delete #'+c+'?'))return;current().channels=current().channels.filter(x=>x!==c);delete state.messages[c];state.channel=current().channels[0];save();render()}
$('serverMenu').onclick=()=>openServer();$('settings').onclick=()=>show('User Settings','<div class="field"><label>DISPLAY NAME</label><input id="modalInput" maxlength="24" value="'+state.name.replace(/"/g,'&quot;')+'"></div><p class="notice">Your profile is currently local to this browser.</p>',()=>{let n=$('modalInput').value.trim();if(n)state.name=n;save();$('modal').classList.remove('open');render()});$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};render();
</script></body></html>
